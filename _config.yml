# Hexo Configuration
## Docs: https://hexo.io/docs/configuration.html
## Source: https://github.com/hexojs/hexo/

# Site
# Site
title: Chenglin
description: 记流年
keywords: "＞𐋣＜"
author: clxladoal
language: zh-CN
timezone: Asia/Shanghai

# URL
## Set your site url here. For example, if you use GitHub Page, set url as 'https://username.github.io/project'
url: http://example.com
permalink: posts/:title/
permalink_defaults:
pretty_urls:
  trailing_index: true # Set to false to remove trailing 'index.html' from permalinks
  trailing_html: true # Set to false to remove trailing '.html' from permalinks

# Directory
source_dir: source
public_dir: public
tag_dir: tags
archive_dir: archives
category_dir: categories
code_dir: downloads/code
i18n_dir: :lang
skip_render:

# Writing
new_post_name: :title.md # File name of new posts
default_layout: post
titlecase: false # Transform title into titlecase
external_link:
  enable: true # Open external links in new tab
  field: site # Apply to the whole site
  exclude: ''
filename_case: 0
render_drafts: false
post_asset_folder: false
relative_link: false
future: true
syntax_highlighter: highlight.js
highlight:
  line_number: true
  auto_detect: false
  tab_replace: ''
  wrap: true
  hljs: false
prismjs:
  preprocess: true
  line_number: true
  tab_replace: ''

# Home page setting
# path: Root path for your blogs index page. (default = '')
# per_page: Posts displayed per page. (0 = disable pagination)
# order_by: Posts order. (Order by date descending by default)
index_generator:
  path: ''
  per_page: 10
  order_by: -date

# Category & Tag
default_category: uncategorized
category_map:
tag_map:

# Metadata elements
## https://developer.mozilla.org/en-US/docs/Web/HTML/Element/meta
meta_generator: true

# Date / Time format
## Hexo uses Moment.js to parse and display date
## You can customize the date format as defined in
## http://momentjs.com/docs/#/displaying/format/
date_format: YYYY-MM-DD
time_format: HH:mm:ss
## updated_option supports 'mtime', 'date', 'empty'
updated_option: 'mtime'

# Pagination
## Set per_page to 0 to disable pagination
per_page: 10
pagination_dir: page

# Include / Exclude file(s)
## include:/exclude: options only apply to the 'source/' folder
include:
exclude:
ignore:

# 鼠标点击爱心特效
click_heart:
  enable: true

  # 回到顶部按钮
back2top:
  enable: true
  sidebar: false
  scrollpercent: true


  # 阅读进度条
reading_progress:
  enable: true
  color: "#37c6ff"
  height: 3px


  # 图片灯箱（点击图片放大）
photofigcaption: false
medium_zoom: true

# 页脚美化
footer:
  owner:
    enable: true
    since: 2026 # 【改这里】博客建站年份
    icon:
      name: fa-solid fa-heart
      animated: true
      color: "#ff3838"
  custom_text: "Powered by Hexo & Butterfly"

  # 页面圆角美化
rounded_corner:
  enable: true
  post_block: true
  post_content: true
  sidebar: true
  tag_card: true

  # 文章目录toc
toc:
  enable: true
  number: false
  wrap: true
  expand: true
  style: default

  # 文章设置
post_meta:
  page:
    date_type: created
    date_format: YYYY-MM-DD
    categories: true
    tags: true
    label: true
  post:
    date_type: created
    date_format: YYYY-MM-DD
    categories: true
    tags: true
    label: true



#permalink: posts/:title/

#background: "#f7f9fc"

top_img: url(https://cdn.jsdelivr.net/gh/clxlaodal/blog-img@main/img/3.jpg)

# Extensions
## Plugins: https://hexo.io/plugins/
## Themes: https://hexo.io/themes/
theme: butterfly
# Deployment
## Docs: https://hexo.io/docs/one-command-deployment
deploy:
  type: git
  repo: https://github.com/clxlaodal/clxlaodal.github.io.git
  branch: main